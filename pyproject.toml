[project]
name = "kirha"
version = "0.1.0"
description = "Official Python SDK for the Kirha Search and Tools API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kirha" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["kirha", "search", "ai", "api", "sdk"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://kirha.com"
Documentation = "https://docs.kirha.com"
Repository = "https://github.com/kirha-ai/kirha-sdk-python"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "respx>=0.23.1", "ruff>=0.17.0"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]

[tool.pytest]
addopts = ["-m", "not integration"]
markers = ["integration: calls the live Kirha API, needs KIRHA_API_KEY"]
